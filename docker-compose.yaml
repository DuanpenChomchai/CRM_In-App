version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: Stage-base_CRM-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - CRM_in-app_postgres_data:/var/lib/postgresql/data
    
  pgadmin:
      image: dpage/pgadmin4
      container_name: my_pgadmin
      environment:
        PGADMIN_DEFAULT_EMAIL: admin@admin.com
        PGADMIN_DEFAULT_PASSWORD: admin
      ports:
        - "8080:80"
      depends_on:
        - postgres
        
  minio:
    image: minio/minio
    container_name: CRM_in-app-minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    command: server /data --console-address ":9001"
    volumes:
      - CRM_in-app_minio_data:/data


volumes:
  CRM_in-app_postgres_data:
  CRM_in-app_minio_data: